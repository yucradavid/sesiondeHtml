<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Docente | Academia Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
    <style>
        body { height: auto; min-height: 100vh; display: block; }
    </style>
</head>
<body>
    <main class="max-w-6xl mx-auto p-5">
        <header class="flex flex-wrap justify-between items-center gap-3 mb-6 border-b border-slate-700 pb-4">
            <h1 class="text-3xl font-bold text-white"><i class="fa-solid fa-chalkboard-user"></i> Panel de Monitoreo</h1>
            <a href="laboratorio_html_en_vivo.html" class="bg-slate-600 px-4 py-2 rounded text-white">Volver al laboratorio</a>
        </header>

        <section id="teacher-login" class="modal-box mx-auto">
            <h2 class="text-2xl font-bold text-white mb-2">Acceso Docente</h2>
            <label class="sr-only" for="teacher-email">Correo docente</label>
            <input type="email" id="teacher-email" class="w-full p-3 my-2 rounded border border-slate-600 bg-slate-800 text-white" placeholder="Correo docente" autocomplete="username">
            <label class="sr-only" for="teacher-pass">Contraseña</label>
            <input type="password" id="teacher-pass" class="w-full p-3 my-2 rounded border border-slate-600 bg-slate-800 text-white" placeholder="Contraseña" autocomplete="current-password">
            <p id="teacher-error" class="hidden text-red-400 text-sm my-3" role="alert"></p>
            <button onclick="TeacherPanel.login()" class="w-full bg-red-500 text-white p-3 rounded font-bold">Acceder</button>
            <p class="mt-3 text-xs text-slate-400">Usa la cuenta docente que configuraste en Supabase. <a class="text-purple-300 underline" href="arquitectura_modular_del_laboratorio.md#activar-practica-en-tiempo-real-con-supabase" target="_blank" rel="noopener">Ver instrucciones de configuración</a>.</p>
        </section>

        <section id="teacher-dashboard" class="hidden">
            <div class="student-card flex flex-wrap items-center justify-between gap-4 mb-6">
                <div>
                    <h2 class="text-xl font-bold text-white">Control de la práctica</h2>
                    <p id="class-status" class="mt-1 text-slate-300">Conectando…</p>
                    <p id="student-count" class="mt-1 text-sm text-green-300">Conectados: 0 / 0</p>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    <label class="sr-only" for="teacher-session">Sesión de práctica</label>
                    <select id="teacher-session" class="rounded border border-slate-600 bg-slate-800 p-3 text-white"></select>
                    <button id="start-class" onclick="TeacherPanel.toggleClass()" class="rounded bg-green-600 px-4 py-3 font-bold text-white">Dar comienzo a la práctica</button>
                    <button onclick="TeacherPanel.logout()" class="rounded bg-slate-600 px-4 py-3 text-white">Cerrar sesión docente</button>
                </div>
            </div>

            <section class="mb-8">
                <h2 class="mb-3 text-2xl font-bold text-white">Estudiantes y puntos</h2>
                <div id="students-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
            </section>

            <section>
                <h2 class="mb-3 text-2xl font-bold text-white">Solicitudes de ayuda</h2>
                <div id="help-requests" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </section>
        </section>
    </main>

    <script type="module" src="js/core/teacher.js"></script>
</body>
</html>
