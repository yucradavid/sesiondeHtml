<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Aprendizaje Web</title>
    <link href="css/estilos.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closetag.min.js"></script>
</head>
<body>
    <header class="bg-slate-800 p-3 flex justify-between items-center border-b-2 border-slate-700">
        <div class="flex items-center gap-4">
            <i class="fa-solid fa-graduation-cap text-purple-500 text-2xl"></i>
            <h1 class="text-xl font-bold text-white">Academia Web</h1>
            <select id="session-selector" class="bg-slate-900 text-white border border-slate-600 rounded px-3 py-1 text-sm outline-none focus:border-purple-500" aria-label="Seleccionar sesión"></select>
        </div>
        <div class="flex items-center gap-4">
            <a href="panel_docente.html" class="text-slate-500 hover:text-white" title="Panel Docente" aria-label="Panel Docente"><i class="fa-solid fa-user-shield"></i></a>
            <div id="level-badge" class="px-4 py-1 rounded-full bg-slate-700 text-white font-bold text-sm">Rango: Observador 👀</div>
            <button onclick="SystemApp.exportCode()" class="text-sm text-green-400 border border-green-400/30 rounded px-3 py-1 hover:bg-green-400/10"><i class="fa-solid fa-download"></i> Descargar</button>
            <button onclick="SystemApp.resetSession()" class="text-sm text-red-400 border border-red-400/30 rounded px-3 py-1 hover:bg-red-400/10"><i class="fa-solid fa-rotate-right"></i> Reset</button>
        </div>
    </header>

    <main class="workspace">
        <section class="panel panel-editor" id="panel-editor">
            <div class="panel-header"><div><i class="fa-solid fa-code text-blue-400 mr-2"></i>Editor</div></div>
            <textarea id="code-editor"></textarea>
        </section>
        <div class="resizer" id="drag-me" role="separator" aria-orientation="vertical" aria-label="Redimensionar editor y vista previa"></div>
        <section class="panel panel-preview" id="panel-preview">
            <div class="panel-header"><div><i class="fa-solid fa-eye text-green-400 mr-2"></i>Vista Previa</div></div>
            <iframe id="preview-frame" title="Vista previa de tu código"></iframe>
        </section>
        <aside class="panel panel-sidebar flex flex-col">
            <div class="panel-header justify-center bg-purple-900/30 text-purple-200">
                <i class="fa-solid fa-list-check mr-2"></i><span id="sidebar-title">Misiones</span>
            </div>
            <div id="missions-container" class="overflow-y-auto flex-1 p-2 space-y-2"></div>
            <div id="success-banner" class="hidden p-4 bg-green-600/20 border-t border-green-500 text-green-400 text-center font-bold text-sm">
                ¡SESIÓN COMPLETADA! 🎉
            </div>
        </aside>
    </main>

    <div id="login-modal" class="modal-overlay">
        <div class="modal-box">
            <h2 class="text-2xl font-bold text-white mb-2">Identificación</h2>
            <label class="sr-only" for="student-name">Tu nombre</label>
            <input type="text" id="student-name" class="w-full p-3 my-4 rounded border border-slate-600 bg-slate-800 text-white" placeholder="Tu Nombre..." autocomplete="off">
            <p id="student-error" class="hidden text-red-400 text-sm mb-3" role="alert">Escribe tu nombre para entrar al laboratorio.</p>
            <button onclick="SystemApp.loginStudent()" class="w-full bg-purple-600 text-white p-3 rounded font-bold hover:bg-purple-500 transition">Entrar al Lab</button>
        </div>
    </div>

    <script src="js/sesiones/index.js"></script>
    <script src="js/core/editor.js"></script>
    <script src="js/core/parser.js"></script>
    <script src="js/core/db.js"></script>
    <script src="js/core/app.js"></script>
</body>
</html>
